{{- /* 段落导航：滚动高亮当前段落（右侧栏 + 移动端横条共用） */ -}}
{{- if .IsPage }}
<script>
(function () {
    var containers = document.querySelectorAll('.toc-side, .toc-bar');
    if (!containers.length) return;

    var links = [];
    Array.prototype.forEach.call(containers, function (nav) {
        links = links.concat(Array.prototype.slice.call(nav.querySelectorAll('a[data-anchor]')));
    });
    if (!links.length) return;

    // 按 id 去重，并记录真实锚点元素
    var ids = [];
    var targets = {};
    links.forEach(function (a) {
        var id = a.getAttribute('data-anchor');
        if (!id || targets[id]) return;
        var el = document.getElementById(id);
        if (!el) return;
        targets[id] = el;
        ids.push(id);
    });
    if (!ids.length) return;

    // 两个容器顺序不同，按文档中的真实位置排序
    ids.sort(function (x, y) {
        return targets[x].compareDocumentPosition(targets[y]) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1;
    });

    var OFFSET = 96;   // 判定「当前段落」的顶线，调大 → 更早切换
    var LAST = null;
    var ticking = false;

    // 移动端横条：把当前项滚进可视区
    function centerInBar(link) {
        var bar = link.closest('.toc-bar');
        if (!bar || bar.clientWidth === 0) return;
        var left = link.offsetLeft;
        var right = left + link.offsetWidth;
        var pad = 16;
        if (left < bar.scrollLeft) {
            bar.scrollLeft = Math.max(0, left - pad);
        } else if (right > bar.scrollLeft + bar.clientWidth) {
            bar.scrollLeft = right - bar.clientWidth + pad;
        }
    }

    function update() {
        ticking = false;

        var bestId = ids[0];
        for (var i = 0; i < ids.length; i++) {
            if (targets[ids[i]].getBoundingClientRect().top <= OFFSET) {
                bestId = ids[i];
            } else {
                break;
            }
        }

        // 滚到底部时点亮最后一段
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 4) {
            bestId = ids[ids.length - 1];
        }

        if (bestId === LAST) return;
        LAST = bestId;

        links.forEach(function (a) {
            a.classList.toggle('is-active', a.getAttribute('data-anchor') === bestId);
        });

        var active = document.querySelector('.toc-bar a.is-active');
        if (active) centerInBar(active);
    }

    window.addEventListener('scroll', function () {
        if (!ticking) {
            ticking = true;
            window.requestAnimationFrame(update);
        }
    }, { passive: true });

    window.addEventListener('resize', update, { passive: true });
    update();
})();
</script>
{{- end }}
